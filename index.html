<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HijabByTami - Pashmina Mini Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fcfaf7; 
            color: #4a3f35; 
            max-width: 480px; 
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(169, 132, 103, 0.08);
            min-height: 100vh;
            position: relative;
        }

        header {
            background-color: #f5ebe0; 
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e3d5ca;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .fa-bars {
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s ease;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 35px;
            height: 35px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #d5bdaf;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #4a3f35;
        }

        .cart-box {
            background: #e3d5ca;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #4a3f35;
            transition: transform 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        
        .cart-box:hover {
            transform: scale(1.05);
        }

        .uas-tabs {
            display: flex;
            background: #fdf6f0;
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 4px;
            border: 1px solid #e3d5ca;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-weight: 600;
            font-size: 0.85rem;
            color: #a98467;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #4a3f35;
            color: #f5ebe0;
        }

        .search-container {
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1px solid transparent;
            border-radius: 12px;
            background-color: #fcfaf7;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            background-color: #ffffff;
            border-color: #d5bdaf;
            box-shadow: 0 0 10px rgba(213, 189, 175, 0.3);
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a98467;
        }

        .main-content {
            padding: 15px;
            background-color: #ffffff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .hero-banner {
            background: linear-gradient(135deg, #e3d5ca, #d5bdaf);
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            color: #4a3f35;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(74, 63, 53, 0.05);
        }

        .hero-banner h1 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .hero-banner p {
            font-size: 0.85rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .tag-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.55);
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
            margin-bottom: 15px;
        }

        .about-section {
            background: #fcfaf7;
            border-radius: 18px;
            padding: 20px 15px;
            margin-bottom: 25px;
            border-left: 4px solid #a98467;
        }

        .about-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 8px;
        }

        .about-section p {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #6c5a4b;
            margin-bottom: 10px;
        }

        .vimi-box {
            background: #ffffff;
            border: 1px solid #e3d5ca;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }

        .vimi-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #a98467;
            margin-bottom: 4px;
        }

        .video-section {
            margin-bottom: 25px;
            background-color: #fdf6f0;
            padding: 15px;
            border-radius: 18px;
            border: 1px solid #f5ebe0;
        }

        .video-section h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 10px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-wrapper video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
        }

        .restock-notice {
            background-color: #fdf6f0;
            color: #a98467;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px dashed #d5bdaf;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #f5ebe0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .img-container {
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: 12px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 10px 4px 4px 4px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a3f35;
            min-height: 2.6rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-rating {
            font-size: 0.75rem;
            color: #ffb703;
            margin: 2px 0 6px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .rating-text {
            color: #757575;
            font-size: 0.7rem;
        }

        .product-price {
            font-size: 0.9rem;
            color: #a98467;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stock-info-shopee {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: auto; 
            margin-bottom: 12px;
        }

        .stock-status-text {
            font-size: 0.72rem;
            color: #757575; 
            display: flex;
            justify-content: space-between;
        }

        .highlight-orange {
            color: #ee4d2d; 
            font-weight: 700;
        }

        .stock-bar-container {
            width: 100%;
            height: 5px;
            background-color: #f1f1f1;
            border-radius: 10px;
            overflow: hidden;
        }

        .stock-bar-fill {
            height: 100%;
            background-color: #ee4d2d; 
        }

        .qty-container {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e3d5ca;
            border-radius: 20px;
            margin-bottom: 8px;
            background-color: #fcfaf7;
        }

        .qty-btn {
            background: none;
            border: none;
            padding: 5px 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #a98467;
            cursor: pointer;
        }

        .qty-input {
            width: 35px;
            text-align: center;
            border: none;
            background: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a3f35;
            outline: none;
        }

        .btn-add-cart {
            background-color: #4a3f35;
            color: #f5ebe0;
            border: none;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* REVIEW SECTION */
        .reviews-section {
            background-color: #fdf6f0;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #f5ebe0;
        }

        .reviews-section h3 {
            font-size: 0.95rem;
            font-weight: 60
