<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HijabByTami - Pashmina Mini Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fcfaf7; 
            color: #4a3f35; 
            max-width: 480px; 
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(169, 132, 103, 0.08);
            min-height: 100vh;
            position: relative;
        }

        header {
            background-color: #f5ebe0; 
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e3d5ca;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .fa-bars {
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .fa-bars:hover {
            color: #a98467;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 35px;
            height: 35px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #d5bdaf;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #4a3f35;
        }

        .cart-box {
            background: #e3d5ca;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #4a3f35;
            transition: transform 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        
        .cart-box:hover {
            transform: scale(1.05);
        }

        .search-container {
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1px solid transparent;
            border-radius: 12px;
            background-color: #fcfaf7;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            background-color: #ffffff;
            border-color: #d5bdaf;
            box-shadow: 0 0 10px rgba(213, 189, 175, 0.3);
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a98467;
        }

        .main-content {
            padding: 0 15px 15px 15px;
            background-color: #ffffff;
        }

        /* BANNER DENGAN POLA GELOMBANG */
        .hero-banner {
            background-color: #d5bdaf; 
            background-image: 
                radial-gradient(circle at 50% 0, rgba(255,255,255,0.15) 24%, transparent 25%),
                radial-gradient(circle at 50% 100%, #d5bdaf 24%, transparent 25%),
                radial-gradient(circle at 50% 100%, rgba(255,255,255,0.15) 29%, transparent 30%),
                radial-gradient(circle at 50% 0, #d5bdaf 29%, transparent 30%);
            background-size: 60px 30px;
            background-position: 0 0, 0 0, 30px 15px, 30px 15px;
            
            padding: 35px 20px;
            text-align: center;
            color: #4a3f35;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            margin: 15px 0;
        }

        .hero-banner h1 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .hero-banner p {
            font-size: 0.85rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .tag-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.55);
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
            margin-bottom: 15px;
        }

        .hero-subtext {
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* SECTION TENTANG TOKO */
        .about-section {
            background: #fcfaf7;
            border-radius: 18px;
            padding: 20px 15px;
            margin-bottom: 25px;
            border-left: 4px solid #a98467;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .about-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 8px;
        }

        .about-section p {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #6c5a4b;
            margin-bottom: 12px;
        }

        .btn-vision-mission {
            background-color: #a98467;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-vision-mission:hover {
            background-color: #8c6d53;
        }

        /* MODAL POPUP VISI MISI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h3 {
            font-size: 1.1rem;
            color: #4a3f35;
            margin-bottom: 15px;
            border-bottom: 2px solid #f5ebe0;
            padding-bottom: 8px;
        }

        .vision-mission h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #a98467;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .vision-mission p {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 10px;
        }

        .btn-close-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            font-size: 1.2rem; color: #a98467;
            cursor: pointer;
        }

        /* SIDEBAR NAV/FILTER KIRI */
        .sidebar-left {
            position: fixed;
            top: 0; left: -100%;
            width: 100%; max-width: 320px; height: 100%;
            background-color: #ffffff;
            box-shadow: 5px 0 25px rgba(74, 63, 53, 0.15);
            z-index: 1500;
            transition: left 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
        }

        .sidebar-left.show {
            left: 0;
        }

        .sidebar-left h3 {
            font-size: 1.05rem;
            margin-bottom: 20px;
            color: #4a3f35;
            border-bottom: 1px solid #f5ebe0;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-btn {
            background: #fcfaf7;
            border: 1px solid #e3d5ca;
            padding: 12px 15px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4a3f35;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: #4a3f35;
            color: #f5ebe0;
            border-color: #4a3f35;
        }

        /* SECTION VIDEO PRODUK */
        .video-section {
            margin-bottom: 25px;
            background-color: #fdf6f0;
            padding: 15px;
            border-radius: 18px;
            border: 1px solid #f5ebe0;
        }

        .video-section h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(169, 132, 103, 0.1);
        }

        .video-wrapper video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; background-color: #000;
        }

        /* REVIEW / REKOMENDASI KOMENTAR */
        .review-section {
            margin-bottom: 25px;
        }

        .review-section h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 12px;
        }

        .review-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .review-card {
            background: #fcfaf7;
            border: 1px solid #f5ebe0;
            border-radius: 14px;
            padding: 12px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .reviewer-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a3f35;
        }

        .review-date {
            font-size: 0.7rem;
            color: #a98467;
        }

        .review-comment {
            font-size: 0.78rem;
            color: #6c5a4b;
            line-height: 1.4;
        }

        .restock-notice {
            background-color: #fdf6f0;
            color: #a98467;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px dashed #d5bdaf;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* RATING BINTANG */
        .rating-container {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 4px 0;
        }

        .rating-stars {
            color: #ffcc00;
            font-size: 0.75rem;
        }

        .rating-text {
            font-size: 0.7rem;
            color: #757575;
        }

        /* PRODUCT GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            align-items: stretch;
        }

        .product-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #f5ebe0;
            padding: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(169, 132, 103, 0.12);
        }

        .img-container {
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: 12px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-info {
            padding: 10px 4px 4px 4px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a3f35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 2.6rem;
        }

        .product-price {
            font-size: 0.9rem;
            color: #a98467;
            font-weight: 700;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .stock-info-shopee {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: auto; 
            padding-top: 4px;
            margin-bottom: 12px;
        }

        .stock-status-text {
            font-size: 0.72rem;
            color: #757575; 
            display: flex;
            justify-content: space-between;
        }

        .stock-status-text .highlight-orange {
            color: #ee4d2d; 
            font-weight: 700;
        }

        .stock-bar-container {
            width: 100%;
            height: 5px;
            background-color: #f1f1f1;
            border-radius: 10px;
            overflow: hidden;
        }

        .stock-bar-fill {
            height: 100%;
            background-color: #ee4d2d; 
            border-radius: 10px;
        }

        .qty-container {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e3d5ca;
            border-radius: 20px;
            margin-bottom: 8px;
            background-color: #fcfaf7;
            overflow: hidden;
        }

        .qty-btn {
            background: none;
            border: none;
            padding: 5px 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #a98467;
            cursor: pointer;
        }

        .qty-input {
            width: 35px;
            text-align: center;
            border: none;
            background: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a3f35;
            outline: none;
        }

        .btn-add-cart {
            background-color: #4a3f35;
            color: #f5ebe0;
            border: none;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* SIDEBAR CART */
        .sidebar-cart {
            position: fixed;
            top: 0; right: -100%; 
            width: 100%; max-width: 480px; height: 100%;
            background-color: #ffffff;
            box-shadow: -5px 0 25px rgba(74, 63, 53, 0.15);
            z-index: 1000;
            transition: right 0.3s ease
