<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HijabByTami - Pashmina Mini Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fcfaf7; 
            color: #4a3f35; 
            /* Perubahan Responsif: max-width dilepas agar bisa full-width di laptop, diganti pembatas di main container */
            min-height: 100vh;
            position: relative;
        }

        /* Container utama untuk membatasi tampilan di mobile vs laptop */
        .app-container {
            max-width: 480px; /* Default tampilan HP */
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 0 25px rgba(169, 132, 103, 0.08);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #f5ebe0; 
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e3d5ca;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .fa-bars {
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .fa-bars:hover {
            color: #a98467;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 35px;
            height: 35px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #d5bdaf;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #4a3f35;
        }

        .cart-box {
            background: #e3d5ca;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #4a3f35;
            transition: transform 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        
        .cart-box:hover {
            transform: scale(1.05);
        }

        .search-container {
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1px solid transparent;
            border-radius: 12px;
            background-color: #fcfaf7;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            background-color: #ffffff;
            border-color: #d5bdaf;
            box-shadow: 0 0 10px rgba(213, 189, 175, 0.3);
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a98467;
        }

        .main-content {
            padding: 0 15px 15px 15px;
            background-color: #ffffff;
            flex: 1;
        }

        .hero-banner {
            background-color: #d5bdaf; 
            background-image: 
                radial-gradient(circle at 50% 0, rgba(255,255,255,0.15) 24%, transparent 25%),
                radial-gradient(circle at 50% 100%, #d5bdaf 24%, transparent 25%),
                radial-gradient(circle at 50% 100%, rgba(255,255,255,0.15) 29%, transparent 30%),
                radial-gradient(circle at 50% 0, #d5bdaf 29%, transparent 30%);
            background-size: 60px 30px;
            background-position: 0 0, 0 0, 30px 15px, 30px 15px;
            
            padding: 35px 20px;
            text-align: center;
            color: #4a3f35;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            margin: 15px 0;
        }

        .hero-banner h1 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .hero-banner p {
            font-size: 0.85rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .tag-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.55);
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
            margin-bottom: 15px;
        }

        .hero-subtext {
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* FITUR BARU: OVERVIEW & SPESIFIKASI PRODUK */
        .overview-section {
            background: #fffcf9;
            border: 1px solid #f5ebe0;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .overview-section h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .specs-table tr {
            border-bottom: 1px dashed #e3d5ca;
        }

        .specs-table tr:last-child {
            border-bottom: none;
        }

        .specs-table td {
            padding: 8px 4px;
            color: #6c5a4b;
        }

        .specs-table td.label {
            font-weight: 600;
            color: #4a3f35;
            width: 35%;
        }

        .about-section {
            background: #fcfaf7;
            border-radius: 18px;
            padding: 20px 15px;
            margin-bottom: 25px;
            border-left: 4px solid #a98467;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .about-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 8px;
        }

        .about-section p {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #6c5a4b;
            margin-bottom: 12px;
        }

        .btn-vision-mission {
            background-color: #a98467;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-vision-mission:hover {
            background-color: #8c6d53;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
