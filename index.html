<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HijabByTami - Pashmina Mini Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fcfaf7; 
            color: #4a3f35; 
            max-width: 480px; 
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(169, 132, 103, 0.08);
            min-height: 100vh;
            position: relative;
        }

        /* --- TAMBAHAN RESPONSIF UNTUK LAPTOP/DESKTOP --- */
        @media screen and (min-width: 768px) {
            body { max-width: 900px; }
            .product-grid { grid-template-columns: repeat(3, 1fr) !important; }
            .sidebar-left, .sidebar-cart { max-width: 400px; }
        }

        header {
            background-color: #f5ebe0; 
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e3d5ca;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .fa-bars { cursor: pointer; padding: 5px; transition: color 0.3s ease; }
        .fa-bars:hover { color: #a98467; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 35px; height: 35px; object-fit: cover; border-radius: 50%; border: 1px solid #d5bdaf; }
        .brand-name { font-weight: 700; font-size: 1.2rem; letter-spacing: 0.5px; color: #4a3f35; }
        .cart-box { background: #e3d5ca; padding: 5px 14px; border-radius: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #4a3f35; transition: transform 0.2s ease; cursor: pointer; user-select: none; }
        .cart-box:hover { transform: scale(1.05); }

        .search-container { position: relative; }
        .search-container input { width: 100%; padding: 12px 15px 12px 42px; border: 1px solid transparent; border-radius: 12px; background-color: #fcfaf7; outline: none; font-size: 0.9rem; transition: all 0.3s ease; }
        .search-container input:focus { background-color: #ffffff; border-color: #d5bdaf; box-shadow: 0 0 10px rgba(213, 189, 175, 0.3); }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #a98467; }

        .main-content { padding: 0 15px 15px 15px; background-color: #ffffff; }

        .hero-banner {
            background-color: #d5bdaf; 
            background-image: radial-gradient(circle at 50% 0, rgba(255,255,255,0.15) 24%, transparent 25%), radial-gradient(circle at 50% 100%, #d5bdaf 24%, transparent 25%), radial-gradient(circle at 50% 100%, rgba(255,255,255,0.15) 29%, transparent 30%), radial-gradient(circle at 50% 0, #d5bdaf 29%, transparent 30%);
            background-size: 60px 30px;
            background-position: 0 0, 0 0, 30px 15px, 30px 15px;
            padding: 35px 20px; text-align: center; color: #4a3f35; position: relative; overflow: hidden; border-radius: 24px; margin: 15px 0;
        }

        .hero-banner h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.3; margin-bottom: 10px; }
        .hero-banner p { font-size: 0.85rem; margin-bottom: 15px; opacity: 0.9; }
        .tag-badge { display: inline-block; background: rgba(255, 255, 255, 0.55); padding: 6px 16px; border-radius: 25px; font-size: 0.75rem; font-weight: 600; backdrop-filter: blur(5px); margin-bottom: 15px; }

        .about-section { background: #fcfaf7; border-radius: 18px; padding: 20px 15px; margin-bottom: 25px; border-left: 4px solid #a98467; }
        .about-section h3 { font-size: 1rem; font-weight: 600; color: #4a3f35; margin-bottom: 8px; }
        .about-section p { font-size: 0.8rem; line-height: 1.5; color: #6c5a4b; margin-bottom: 12px; }
        .btn-vision-mission { background-color: #a98467; color: white; border: none; padding: 8px 16px; border-radius: 12px; font-size: 0.78rem; cursor: pointer; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: #ffffff; padding: 25px 20px; border-radius: 20px; max-width: 380px; width: 90%; }

        .sidebar-left { position: fixed; top: 0; left: -100%; width: 100%; max-width: 320px; height: 100%; background-color: #ffffff; box-shadow: 5px 0 25px rgba(74, 63, 53, 0.15); z-index: 1500; transition: left 0.3s ease-in-out; display: flex; flex-direction: column; padding: 25px 20px; }
        .sidebar-left.show { left: 0; }
        .filter-btn { background: #fcfaf7; border: 1px solid #e3d5ca; padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; width: 100%; text-align: left; }
        .filter-btn.active { background-color: #4a3f35; color: #f5ebe0; }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
        .product-card { background: #ffffff; border-radius: 18px; border: 1px solid #f5ebe0; padding: 8px; display: flex; flex-direction: column; }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; }
        .product-info { padding: 10px 4px; }
        .btn-add-cart { background-color: #4a3f35; color: #f5ebe0; border: none; padding: 8px; border-radius: 20px; cursor: pointer; width: 100%; margin-top: 10px; }
        
        .sidebar-cart { position: fixed; top: 0; right: -100%; width: 100%; max-width: 480px; height: 100%; background-color: #ffffff; z-index: 1000; transition: right 0.3s ease-in-out; }
        .sidebar-cart.show { right: 0; }
        
        footer { background-color: #4a3f35; color: #f5ebe0; padding: 25px 20px; border-radius: 20px 20px 0 0; text-align: center; }
        .btn-contact { padding: 10px 20px; border-radius: 25px; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin: 5px; }
        .btn-wa { background-color: #25D366; color: white; }
        .btn-shopee { background-color: #ee4d2d; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="nav-top">
            <i class="fa-solid fa-bars" onclick="toggleSidebarLeft()"></i>
            <div class="logo-container">
                <img src="logo.jpeg" alt="Logo" class="brand-logo">
                <div class="brand-name">HijabByTami</div>
            </div>
            <div class="cart-box" onclick="toggleSidebarCart()">
                <i class="fa-solid fa-shopping-bag"></i> <span id="total-cart">0</span>
            </div>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" onkeyup="cariProduk()" placeholder="Cari koleksi pashmini...">
        </div>
    </header>

    <div id="sidebar-left" class="sidebar-left">
        <h3>Filter Warna <i class="fa-solid fa-xmark" style="float:right; cursor:pointer;" onclick="toggleSidebarLeft()"></i></h3>
        <button class="filter-btn active" id="btn-all" onclick="filterWarna('all')">Semua Koleksi</button>
        <button class="filter-btn" id="btn-bright" onclick="filterWarna('bright')">Warna Terang</button>
        <button class="filter-btn" id="btn-earth" onclick="filterWarna('earth')">Earth Tones</button>
    </div>

    <main class="main-content">
        <div class="hero-banner">
            <h1>Sentuhan Anggun Setiap Hari</h1>
            <p>Pashmina mini premium, tegak di dahi dan nyaman.</p>
        </div>

        <div class="product-grid" id="product-container">
            <!-- Produk 1 -->
            <div class="product-card" data-color="bright">
                <img src="gambar1.jpeg" class="product-img">
                <div class="product-info">
                    <div>Pashmina Mini - Soft Pink</div>
                    <div style="font-weight:700;">Rp 50.000</div>
                    <button class="btn-add-cart" onclick="alert('Ditambahkan!')">Tambah ke Keranjang</button>
                </div>
            </div>
            <!-- Produk 2 -->
            <div class="product-card" data-color="earth">
                <img src="gambar2.jpeg" class="product-img">
                <div class="product-info">
                    <div>Pashmina Mini - Taupe</div>
                    <div style="font-weight:700;">Rp 50.000</div>
                    <button class="btn-add-cart" onclick="alert('Ditambahkan!')">Tambah ke Keranjang</button>
                </div>
            </div>
            <!-- Tambahkan produk lainnya di sini mengikuti format di atas -->
        </div>
    </main>

    <div id="sidebar-cart" class="sidebar-cart">
        <div style="padding: 20px;">
            <h3>Keranjang <i class="fa-solid fa-xmark" style="float:right; cursor:pointer;" onclick="toggleSidebarCart()"></i></h3>
            <div id="sidebar-body">Keranjang kosong.</div>
        </div>
    </div>

    <footer>
        <h4>Hubungi Kami</h4>
        <a href="https://wa.me/6287753617027" class="btn-contact btn-wa">WhatsApp</a>
        <a href="https://id.shp.ee/B4exDpf4" class="btn-contact btn-shopee">Shopee</a>
    </footer>

    <script>
        function toggleSidebarLeft() { document.getElementById('sidebar-left').classList.toggle('show'); }
        function toggleSidebarCart() { document.getElementById('sidebar-cart').classList.toggle('show'); }
        
        function filterWarna(kategori) {
            const cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                let warna = cards[i].getAttribute('data-color');
                cards[i].style.display = (kategori === 'all' || warna === kategori) ? "" : "none";
            }
            toggleSidebarLeft();
        }
        
        function cariProduk() {
            const input = document.getElementById('search-input').value.toLowerCase();
            const cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                let judul = cards[i].querySelector('.product-info').textContent.toLowerCase();
                cards[i].style.display = judul.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
