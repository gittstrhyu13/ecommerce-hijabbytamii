<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HijabByTami - Pashmina Mini Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fcfaf7; 
            color: #4a3f35; 
            min-height: 100vh;
            position: relative;
            margin: 0 auto;
        }

        header {
            background-color: #f5ebe0; 
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e3d5ca;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .fa-bars {
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .fa-bars:hover {
            color: #a98467;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 35px;
            height: 35px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #d5bdaf;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #4a3f35;
        }

        .cart-box {
            background: #e3d5ca;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #4a3f35;
            transition: transform 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        
        .cart-box:hover {
            transform: scale(1.05);
        }

        .search-container {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-container input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1px solid transparent;
            border-radius: 12px;
            background-color: #fcfaf7;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            background-color: #ffffff;
            border-color: #d5bdaf;
            box-shadow: 0 0 10px rgba(213, 189, 175, 0.3);
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a98467;
        }

        .main-content {
            padding: 20px 15px;
            background-color: #ffffff;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HERO BANNER DENGAN POLA GELOMBANG SESUAI MOCKUP */
        .hero-banner {
            background-color: #d5bdaf; 
            background-image: 
                radial-gradient(circle at 50% 0, rgba(255,255,255,0.15) 24%, transparent 25%),
                radial-gradient(circle at 50% 100%, #d5bdaf 24%, transparent 25%),
                radial-gradient(circle at 50% 100%, rgba(255,255,255,0.15) 29%, transparent 30%),
                radial-gradient(circle at 50% 0, #d5bdaf 29%, transparent 30%);
            background-size: 60px 30px;
            background-position: 0 0, 0 0, 30px 15px, 30px 15px;
            
            padding: 45px 20px;
            text-align: center;
            color: #4a3f35;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            margin: 15px auto 25px auto;
            max-width: 1200px;
        }

        .hero-banner h1 {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .hero-banner p {
            font-size: 0.95rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .tag-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.55);
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
            margin-bottom: 15px;
        }

        .hero-subtext {
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* SECTION TENTANG TOKO */
        .about-section {
            background: #fcfaf7;
            border-radius: 18px;
            padding: 20px 15px;
            margin-bottom: 25px;
            border-left: 4px solid #a98467;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .about-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 8px;
        }

        .about-section p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #6c5a4b;
            margin-bottom: 12px;
        }

        .btn-vision-mission {
            background-color: #a98467;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-vision-mission:hover {
            background-color: #8c6d53;
        }

        /* MODAL POPUP VISI MISI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h3 {
            font-size: 1.1rem;
            color: #4a3f35;
            margin-bottom: 15px;
            border-bottom: 2px solid #f5ebe0;
            padding-bottom: 8px;
        }

        .vision-mission h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #a98467;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .vision-mission p {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 10px;
        }

        .btn-close-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            font-size: 1.2rem; color: #a98467;
            cursor: pointer;
        }

        /* SIDEBAR NAV/FILTER KIRI */
        .sidebar-left {
            position: fixed;
            top: 0; left: -100%;
            width: 100%; max-width: 320px; height: 100%;
            background-color: #ffffff;
            box-shadow: 5px 0 25px rgba(74, 63, 53, 0.15);
            z-index: 1500;
            transition: left 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
        }

        .sidebar-left.show {
            left: 0;
        }

        .sidebar-left h3 {
            font-size: 1.05rem;
            margin-bottom: 20px;
            color: #4a3f35;
            border-bottom: 1px solid #f5ebe0;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-btn {
            background: #fcfaf7;
            border: 1px solid #e3d5ca;
            padding: 12px 15px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4a3f35;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: #4a3f35;
            color: #f5ebe0;
            border-color: #4a3f35;
        }

        /* SECTION VIDEO PRODUK & REVIEW */
        .media-flex-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .video-section {
            background-color: #fdf6f0;
            padding: 15px;
            border-radius: 18px;
            border: 1px solid #f5ebe0;
            flex: 1;
        }

        .video-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #4a3f35;
            margin-bottom
